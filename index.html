<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="description" content="Wood Cutter — an isometric idle incremental game. Chop trees, hire a crew, research tech and prestige through seasons, eras and epochs." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:title" content="Wood Cutter" />
    <meta property="og:description" content="Isometric idle incremental game about chopping wood." />
    <meta property="og:image" content="icons/icon-512.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="style.css" />
    <title>Wood Cutter — Isometric Idle Game</title>
  </head>
  <body>
    <div id="gameContainer">
      <main id="canvasWrap">
        <canvas id="game" aria-label="Forest. Click or tap trees to chop them."></canvas>

        <div id="hud" aria-live="off">
          <div class="hud-item" title="Logs"><span class="hud-icon">🪵</span><span class="hud-val" id="hudLogs">0</span><span class="hud-rate" id="hudLogsRate"></span></div>
          <div class="hud-item" title="Planks"><span class="hud-icon">🪚</span><span class="hud-val" id="hudPlanks">0</span><span class="hud-rate" id="hudPlanksRate"></span></div>
          <div class="hud-item" title="Gold"><span class="hud-icon">🪙</span><span class="hud-val" id="hudGold">0</span><span class="hud-rate" id="hudGoldRate"></span></div>
          <div class="hud-item" id="hudCharcoalItem" title="Charcoal" hidden><span class="hud-icon">🔥</span><span class="hud-val" id="hudCharcoal">0</span></div>
          <div class="hud-item" id="hudFurnitureItem" title="Furniture" hidden><span class="hud-icon">🪑</span><span class="hud-val" id="hudFurniture">0</span></div>
          <div class="hud-item" id="hudLuxuryItem" title="Luxury goods" hidden><span class="hud-icon">✨</span><span class="hud-val" id="hudLuxury">0</span></div>
          <div class="hud-item" id="hudAmberItem" title="Amber" hidden><span class="hud-icon">🔶</span><span class="hud-val amber" id="hudAmber">0</span></div>
          <div class="hud-item" id="hudEpochItem" title="Epoch" hidden><span class="hud-icon">🌌</span><span class="hud-val" id="hudEpoch">1</span></div>
          <div class="hud-item" title="Weather season"><span class="hud-icon" id="hudSeasonIcon">🌸</span><span class="hud-val" id="hudSeason">Spring</span></div>
          <div class="hud-item" title="Time of day"><span class="hud-icon" id="hudTimeIcon">☀️</span><span class="hud-val" id="hudTime">Day</span></div>
          <div class="hud-item" title="Season · Era"><span class="hud-icon">🍂</span><span class="hud-val" id="hudProgress">S1 · E1</span></div>
        </div>

        <div id="seasonProgress" title="Logs needed for the next season"><div class="bar"></div><span id="seasonProgressText"></span></div>
        <div id="eventBanner" hidden></div>
        <div id="notification" role="status"></div>
        <div id="achieveToast" role="status"></div>
        <div id="tooltip" hidden></div>
        <nav id="zoneTabs" aria-label="Zones"></nav>
        <button id="prestigeBanner" data-action="prestige" hidden></button>
        <div id="zoomControls">
          <button data-action="zoomIn" title="Zoom in (+)">＋</button>
          <button data-action="zoomOut" title="Zoom out (−)">－</button>
          <button data-action="resetView" title="Reset view (0)">⌂</button>
        </div>

        <div id="welcomeBack" class="overlay" hidden>
          <div class="modal">
            <h3>🌅 Welcome Back!</h3>
            <div id="wbStats"></div>
            <button data-action="closeWelcome">Continue</button>
          </div>
        </div>
      </main>

      <aside id="shop">
        <div class="shop-header"><h2>🪓 Wood Cutter</h2><span class="ver-badge" id="verBadge"></span></div>
        <div id="shopTabs"></div>
        <div id="shopScroll"><div id="shopContent"></div></div>
      </aside>
    </div>

    <div id="titleScreen">
      <h1>🪓 Wood Cutter</h1>
      <div class="subtitle">ISOMETRIC IDLE INCREMENTAL</div>
      <button class="menu-btn" id="btnContinue" data-action="titleContinue" hidden>▶ Continue</button>
      <button class="menu-btn" id="btnPlay" data-action="titleNew">▶ New Game</button>
      <button class="menu-btn secondary" data-action="titleImport">📥 Import Save</button>
      <button class="menu-btn secondary" data-action="changelog">📋 Changelog</button>
      <div class="ver" id="titleVer"></div>
    </div>

    <div id="changelog" class="overlay" hidden>
      <div class="modal">
        <h3>📋 Changelog</h3>
        <div id="clContent"></div>
        <button data-action="closeChangelog">Close</button>
      </div>
    </div>

    <input type="file" id="fileInput" accept=".json,.txt,application/json,text/plain" hidden />
    <noscript><p class="noscript">Wood Cutter needs JavaScript to run.</p></noscript>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
